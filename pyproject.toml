# Solo configuración de herramientas. El paquete p6 no se instala: los comandos se ejecutan
# con `export PYTHONPATH=src` (ver README). Un `pip install -e .` deja un archivo .pth que
# macOS marca como oculto en carpetas sincronizadas con iCloud, y Python 3.12 lo ignora.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Starlette sugiere httpx2 para su cliente de pruebas; se usa httpx 0.28.1 (fijado), que funciona.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Textos y marcas del SVG con líneas largas
"scripts/calibrar_referencia.py" = ["E501"]
